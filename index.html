<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetCheck</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#89f7fe,#66a6ff);
    overflow:hidden;
}
.card{
    width:90%;
    max-width:520px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:28px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}
h1{
    font-size:34px;
    margin-bottom:18px;
    color:#222;
}
p{
    font-size:18px;
    color:#555;
    line-height:1.8;
}
.buttons{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}
.btn{
    text-decoration:none;
    color:#fff;
    background:#3b82f6;
    padding:12px 22px;
    border-radius:14px;
    transition:.25s;
    font-size:16px;
    font-weight:600;
}
.btn:hover{
    transform:translateY(-2px);
}
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    pointer-events:none;
    animation:fall linear forwards;
}
@keyframes fall{
    from{
        transform:translateY(-50px) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>
<body>
<div class="card">
    <h1>🎉 你现在可以畅快地冲浪了！</h1>
    <p>
        你的网络可以正常访问主流国际互联网服务。
    </p>
    <div class="buttons">
        <a href="twitter://timeline" class="btn">
            🐦 打开 X
        </a>
        <a href="youtube://" class="btn">
            ▶️ 打开 YouTube
        </a>
    </div>
</div>
<script>
for(let i=0;i<180;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=
    `hsl(${Math.random()*360},90%,60%)`;
    d.style.animationDuration=
    (2 + Math.random()*3) + "s";
    document.body.appendChild(d);
    setTimeout(()=>{
        d.remove();
    },5000);
}
</script>
</body>
</html>
